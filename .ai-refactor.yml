language: python
tests: "pytest tests/"
branch_prefix: "ai-refactor"
# Configure Ollama endpoint (default: http://localhost:11434)
# Can also be set via OLLAMA_BASE_URL environment variable
ollama_base_url: "http://192.168.1.4:11434"
# Configure your specific models here
models:
  coder: "ollama/llama3.1:8b"
  planner: "ollama/llama3.1:8b" 
  # planner: "ollama/wangshenzhi/os-copilot-20b" # Example of using a larger model for planning
spec_kit:
  enabled: true
  specs_dir: "specs"
task_presets:
  modernize:
    prompt: "Generate a simple trello-like kanban board app for meetings and notes"